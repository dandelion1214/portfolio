.page-container {
    min-height: 100vh;
    padding: 120px 24px 80px;
}

.page-header {
    max-width: 1200px;
    margin: 0 auto 64px;
    text-align: center;
}

.page-title {
    font-size: 64px;
    letter-spacing: -0.015em;
    font-weight: 700;
    margin-bottom: 16px;
}

.page-description {

}

/* 内容区域 */
.content-wrapper {
    max-width: 1400px;
    margin: 0 auto;
}

.section {

}

.section-title {
    font-size: 40px;
    font-weight: 700;
    margin-bottom: 16px;
    text-align: center;
}

.section-subtitle {
    font-size: 18px;
    color: var(--text-secondary);

/* 对比网格 */
.comparison-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 48px;
    margin-bottom: 64px;
    align-items: start;
}

.comparison-item {
    backdrop-filter: saturate(200%) blur(30px);
    background: var(--card-bg);

}

    font-weight: 600;
    color: var(--text-color);
    margin-bottom: 16px;
    text-align: center;
}

.comparison-image {
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
}

.comparison-image img {
    max-width: 100%;
    height: auto;
    display: block;
}

/* 系列网格 */

    grid-template-columns: repeat(2, 1fr);

.series-item {

.series-name {

    color: var(--accent-color);
    margin-bottom: 20px;
    text-align: center;
}

.series-images {

    gap: 16px;
}

.series-image {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: #f5f5f7;
}

.series-image img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;

/* 账号主页展示 */

    grid-template-columns: repeat(2, 1fr);
    gap: 48px;

    background: rgba(0, 102, 204, 0.05);
    border: 2px solid rgba(0, 102, 204, 0.2);

<script>
// 让左边图片的高度匹配右边图片的高度
function matchImageHeights() {
    const grids = document.querySelectorAll('.comparison-grid');
    
    grids.forEach(grid => {
        const items = grid.querySelectorAll('.comparison-item');
        
        // 每两个item为一组（左边和右边）
        for (let i = 0; i < items.length; i += 2) {
            const leftItem = items[i];
            const rightItem = items[i + 1];
            
            if (leftItem && rightItem) {
                const leftImg = leftItem.querySelector('.comparison-image img');
                const rightImg = rightItem.querySelector('.comparison-image img');
                
                if (leftImg && rightImg) {
                    // 等待右边图片加载完成
                    if (rightImg.complete) {
                        adjustLeftImage(leftImg, rightImg);
                    } else {
                        rightImg.addEventListener('load', () => {
                            adjustLeftImage(leftImg, rightImg);
                        });
                    }
                }
            }
        }
    });
}

function adjustLeftImage(leftImg, rightImg) {
    // 获取右边图片的实际显示高度
    const rightHeight = rightImg.offsetHeight;
    
    // 设置左边图片的最大高度为右边图片的高度
    leftImg.style.maxHeight = rightHeight + 'px';
    leftImg.style.width = 'auto';
    leftImg.style.height = 'auto';
}

// 页面加载完成后执行
window.addEventListener('load', matchImageHeights);

// 窗口大小改变时重新调整
window.addEventListener('resize', matchImageHeights);
</script>
